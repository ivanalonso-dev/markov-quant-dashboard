<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Markov Quant Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ================================= -->
        <!-- TITLE -->
        <!-- ================================= -->

        <h1>MARKOV QUANT DASHBOARD</h1>

        <!-- ================================= -->
        <!-- BTC CHART -->
        <!-- ================================= -->

        <div class="chart-wrapper">

            <canvas id="btcChart"></canvas>

        </div>

        <!-- ================================= -->
        <!-- DASHBOARD GRID -->
        <!-- ================================= -->

        <div class="grid">

            <!-- MARKET STATE -->

            <div class="card">

                <h2>Market State</h2>

                <p id="market-state">
                    Loading...
                </p>

            </div>

            <!-- SIGNAL -->

            <div class="card">

                <h2>Signal</h2>

                <p id="signal" class="hold">
                    Loading...
                </p>

            </div>

            <!-- CONFIDENCE -->

            <div class="card">

                <h2>Confidence</h2>

                <p id="confidence">
                    Loading...
                </p>

            </div>

            <!-- BALANCE -->

            <div class="card">

                <h2>Balance</h2>

                <p id="balance">
                    Loading...
                </p>

            </div>

            <!-- WINRATE -->

            <div class="card">

                <h2>Winrate</h2>

                <p id="winrate">
                    Loading...
                </p>

            </div>

            <!-- SHARPE -->

            <div class="card">

                <h2>Sharpe Ratio</h2>

                <p id="sharpe">
                    Loading...
                </p>

            </div>

        </div>

    </div>

    <!-- ================================= -->
    <!-- CHART.JS -->
    <!-- ================================= -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ================================= -->
    <!-- APP -->
    <!-- ================================= -->

    <script src="app.js"></script>

</body>

</html>
